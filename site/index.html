<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Explainers</title>
<meta name="description" content="Hands-on, animated explainers for machine learning models. Build the model yourself, then watch it scale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:56px 20px 64px}
.kicker{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{background:linear-gradient(90deg,#7df3ff,#a78bfa 55%,#ff6fa8);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:clamp(32px,6vw,52px);letter-spacing:-.03em;margin:10px 0 10px;line-height:1.02}
.lede{font-size:17px;color:var(--muted);max-width:560px;line-height:1.55;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.thumb{height:150px;background:radial-gradient(ellipse at 50% 30%,rgba(90,110,255,.18),transparent 70%),rgba(4,6,16,.6);border-bottom:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font-size:20px;letter-spacing:-.01em}
.body p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font:600 11px var(--mono);padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
footer{margin-top:48px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
.e{stroke:var(--muted);stroke-width:1.5;opacity:.6} .n{fill:var(--muted)} .p{fill:var(--pass)} .f{fill:var(--fail)} .a{fill:var(--accent)}
</style>
<link rel="stylesheet" href="shared/cosmos.css">
<script src="shared/fx.js" defer></script>
</head>
<body>
<div class="cosmos-stars" aria-hidden="true"><i class="s1"></i><i class="s2"></i></div>
<main>
  <div class="kicker">Interactive · build it yourself</div>
  <h1>ML Explainers</h1>
  <p class="lede">Hands-on animations for teaching machine learning. Build the first model by hand on a 10-row table, then watch the algorithm take over at full scale.</p>
  <div class="grid" id="grid"></div>
  <footer>Source on <a href="https://github.com/darrylteo/ml-explainers">GitHub</a>.</footer>
</main>
<script>
const thumbs = {
  forest: `<svg viewBox="0 0 300 150">${[30, 105, 180, 255].map((x, i) => `
    <line class="e" x1="${x}" y1="38" x2="${x - 22}" y2="78"/><line class="e" x1="${x}" y1="38" x2="${x + 22}" y2="78"/>
    <line class="e" x1="${x + 22}" y1="78" x2="${x + 8}" y2="112"/><line class="e" x1="${x + 22}" y1="78" x2="${x + 36}" y2="112"/>
    <circle class="n" cx="${x}" cy="38" r="6"/><circle class="${i % 2 ? 'f' : 'p'}" cx="${x - 22}" cy="78" r="6"/><circle class="n" cx="${x + 22}" cy="78" r="6"/>
    <circle class="p" cx="${x + 8}" cy="112" r="6"/><circle class="f" cx="${x + 36}" cy="112" r="6"/>`).join('')}
    <circle class="a" cx="127" cy="18" r="5"/></svg>`,
  boost: `<svg viewBox="0 0 300 150">${[40, 150, 260].map((x, i) => `
    <line class="e" x1="${x}" y1="40" x2="${x - 26}" y2="88"/><line class="e" x1="${x}" y1="40" x2="${x + 26}" y2="88"/>
    <circle class="n" cx="${x}" cy="40" r="6"/><circle class="p" cx="${x - 26}" cy="88" r="${8 - i * 2}"/><circle class="f" cx="${x + 26}" cy="88" r="${8 - i * 2}"/>
    ${i < 2 ? `<path class="e" d="M${x + 40} 64 L${x + 70} 64" marker-end="url(#ar)"/>` : ''}`).join('')}
    <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" style="color:var(--muted)"/></marker></defs>
    <text x="150" y="132" text-anchor="middle" style="font:600 12px var(--mono);fill:var(--muted)">+ η·f₁ + η·f₂ + η·f₃ …</text></svg>`,
  hclust: `<svg viewBox="0 0 300 150">
    <path class="e" d="M40 128V104H64V128 M52 104V80H100V96 M88 128V96H112V128 M190 128V112H210V128 M230 128V112H250V128 M200 112V92H240V112 M76 80V46H220V92"/>
    ${[40, 64, 88, 112, 190, 210, 230, 250].map((x, i) => `<circle class="${i < 4 ? 'a' : 'f'}" cx="${x}" cy="128" r="5"/>`).join('')}
    <line x1="24" x2="276" y1="68" y2="68" style="stroke:#ff6fa8;stroke-width:2;filter:drop-shadow(0 0 5px #ff6fa8)"/>
    <text x="276" y="60" text-anchor="end" style="font:700 11px var(--mono);fill:#ffb3d1">k = 2</text></svg>`,
  pca: `<svg viewBox="0 0 300 150">
    <line x1="40" y1="128" x2="262" y2="22" style="stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 6px var(--accent))"/>
    ${[[78, 86], [104, 110], [132, 72], [158, 98], [176, 58], [200, 74], [224, 44], [120, 94]].map(([x, y]) => {
      const t = ((x - 40) * 222 + (y - 128) * -106) / (222 * 222 + 106 * 106), fx = 40 + 222 * t, fy = 128 - 106 * t;
      return `<line x1="${x}" y1="${y}" x2="${fx}" y2="${fy}" style="stroke:#ff6fa8;stroke-width:1.3;stroke-dasharray:3 3"/><circle class="n" cx="${x}" cy="${y}" r="5" style="fill:#e9ecff"/><circle cx="${fx}" cy="${fy}" r="3" class="a"/>`;
    }).join('')}
    <text x="262" y="44" text-anchor="end" style="font:700 11px var(--mono);fill:var(--accent)">PC1</text></svg>`,
  eigen: `<svg viewBox="0 0 300 150">
    <ellipse cx="150" cy="78" rx="92" ry="28" transform="rotate(-28 150 78)" style="fill:none;stroke:#ff6fa8;stroke-opacity:.5"/>
    <circle cx="150" cy="78" r="40" style="fill:none;stroke:var(--muted);stroke-dasharray:3 4;opacity:.6"/>
    <line x1="40" y1="136" x2="260" y2="20" style="stroke:#4dffb4;stroke-width:2;filter:drop-shadow(0 0 5px #4dffb4)"/>
    <line x1="150" y1="78" x2="185" y2="59" style="stroke:var(--accent);stroke-width:3"/><line x1="150" y1="78" x2="230" y2="36" style="stroke:#ff6fa8;stroke-width:2;stroke-dasharray:5 3"/>
    <text x="262" y="42" text-anchor="end" style="font:700 11px var(--mono);fill:#4dffb4">A·v = λv</text></svg>`,
};
const EXPLAINERS = [
  { href: 'random-forest/', title: 'Random Forest by hand', thumb: 'forest',
    text: 'Bootstrap a sample, choose splits from 2 random features, grow 500 trees, then drop a new row through all of them plinko-style and take the mode.',
    tags: ['classification', 'bagging', 'Gini'] },
  { href: 'xgboost/', title: 'XGBoost by hand', thumb: 'boost',
    text: 'Start from the mean, build 3 trees on the residuals yourself, boost 97 more with the default settings, and watch an outlier get fitted. Predictions add up, plinko-style.',
    tags: ['regression', 'boosting', 'residuals'] },
  { href: 'hierarchical-clustering/', title: 'Hierarchical clustering by hand', thumb: 'hclust',
    text: 'Merge 10 cities yourself by Ward’s rule, watch hclust merge all 60, cut the dendrogram with a laser, then see what skipping scale() does.',
    tags: ['unsupervised', 'ward.D2', 'dendrogram'] },
  { href: 'pca/', title: 'PCA by hand', thumb: 'pca',
    text: 'Turn a screen between two suns until the planets’ shadows spread widest, find PC1, PC2 and PC3 in 3-D, then read a 16-column map as a landscape and guess where mystery cities sit.',
    tags: ['unsupervised', 'prcomp', 'biplot'] },
  { href: 'eigenvectors/', title: 'Eigenvectors by hand', thumb: 'eigen',
    text: 'Watch a matrix stretch arrows, hunt for the ones it does not turn, see that their stretch is PCA’s spread, then push any arrow until it swings to PC1.',
    tags: ['linear algebra', 'eigen', 'power method'] },
];
document.getElementById('grid').innerHTML = EXPLAINERS.map(e => `
  <a class="card" href="${e.href}">
    <div class="thumb">${thumbs[e.thumb]}</div>
    <div class="body"><h2>${e.title}</h2><p>${e.text}</p><div class="tags">${e.tags.map(t => `<span>${t}</span>`).join('')}</div></div>
  </a>`).join('');
</script>
</body>
</html>
